[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-playground"
version = "3.0.0"
description = "Interactive browser playgrounds on machine learning for two university courses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikita Konkin" }]
dependencies = [
    "streamlit>=1.40,<2",
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "plotly>=5.20,<8",
    "scikit-learn>=1.5,<2",
    "nltk>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = [
    "playground_common",
    "gd_playground",
    "mt_playground",
    "lm_playground",
    "vec_playground",
    "tm_playground",
    "labels_playground",
    "intro_playground",
    "data_playground",
    "leak_playground",
    "metric_playground",
    "fit_playground",
    "nn_playground",
    "dag_playground",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gd_playground"]
